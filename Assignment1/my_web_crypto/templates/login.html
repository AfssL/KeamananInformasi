{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 55px; height: 55px;">
                    <i class="bi bi-lock-fill fs-4"></i>
                </div>
                <h3 class="fw-bold fs-4 text-dark">Selamat Datang</h3>
                <p class="text-muted small">Silakan masuk ke brankas data aman Anda</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Masukkan username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password Akun</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 mb-3 shadow-sm">Masuk Sistem</button>
            </form>
            <div class="text-center">
                <p class="text-muted small mb-0">Belum punya akun? <a href="/register" class="text-decoration-none fw-semibold text-dark">Daftar sekarang</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
